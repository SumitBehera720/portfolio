<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="neon-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Pitch Black Terminal Frame -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg-grad-4)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Top Terminal Window Controls -->
  <circle cx="26" cy="22" r="3" fill="#ef4444" opacity="0.8"/>
  <circle cx="36" cy="22" r="3" fill="#eab308" opacity="0.8"/>
  <circle cx="46" cy="22" r="3" fill="#22c55e" opacity="0.8"/>
  <line x1="16" y1="32" x2="112" y2="32" stroke="#1e293b" stroke-width="1.5"/>

  <!-- CLI Command Prompt Chevron > -->
  <path d="M 24 50 L 38 64 L 24 78" fill="none" stroke="url(#neon-emerald)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)"/>

  <!-- Centered 'SB' Typography in JetBrains Mono / Tech Style -->
  <!-- 'S' Path -->
  <path d="M 68 50 C 68 46 64 43 57 43 C 50 43 47 46 47 50 C 47 55 52 57 60 60 C 69 63 72 67 72 73 C 72 81 65 85 57 85 C 49 85 45 81 45 76" 
        fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 'B' Path -->
  <path d="M 78 43 L 78 85 M 78 43 L 90 43 C 97 43 101 47 101 53 C 101 58 97 62 90 63 C 98 64 102 69 102 76 C 102 83 97 85 89 85 L 78 85" 
        fill="none" stroke="url(#neon-cyan)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)"/>

  <!-- Terminal Cursor / Pulse Bar _ -->
  <line x1="88" y1="94" x2="104" y2="94" stroke="url(#neon-emerald)" stroke-width="4" stroke-linecap="round"/>
</svg>