<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="ribbon-s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="ribbon-b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="ribbon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Clean Obsidian Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg-grad-3)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="none" stroke="#1e293b" stroke-width="2"/>

  <g filter="url(#ribbon-shadow)">
    <!-- Fluid 'S' Stroke -->
    <path d="M 54 36 C 42 36 32 42 32 52 C 32 64 48 64 48 74 C 48 83 38 88 28 84" 
          fill="none" stroke="url(#ribbon-s)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Fluid 'B' Stroke -->
    <path d="M 66 36 L 66 92 M 66 36 C 82 36 94 42 94 52 C 94 62 82 64 66 64 C 84 64 96 68 96 80 C 96 92 82 92 66 92" 
          fill="none" stroke="url(#ribbon-b)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Central Intersect Sparkle / Code Dot -->
  <circle cx="56" cy="64" r="3.5" fill="#ffffff"/>
</svg>