<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bracket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow-1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with subtle luminous border -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg-grad-1)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="none" stroke="url(#accent-grad-1)" stroke-width="2.5" stroke-opacity="0.45"/>

  <!-- Left Code Bracket < -->
  <path d="M 26 44 L 14 64 L 26 84" fill="none" stroke="url(#bracket-grad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Code Bracket > -->
  <path d="M 102 44 L 114 64 L 102 84" fill="none" stroke="url(#bracket-grad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center 'S' Vector Path -->
  <path d="M 54 48 C 54 43 50 39 42 39 C 34 39 31 43 31 48 C 31 54 36 57 44 60 C 53 63 58 67 58 75 C 58 84 50 89 41 89 C 32 89 27 84 27 77" 
        fill="none" stroke="url(#text-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center 'B' Vector Path -->
  <path d="M 68 39 L 68 89 M 68 39 L 83 39 C 91 39 96 43 96 50 C 96 56 92 61 84 62 C 93 63 98 68 98 77 C 98 85 91 89 82 89 L 68 89" 
        fill="none" stroke="url(#accent-grad-1)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Status / Pulse Dot -->
  <circle cx="89" cy="40" r="4.5" fill="#38bdf8" filter="url(#glow-1)"/>
  <circle cx="89" cy="40" r="2.5" fill="#ffffff"/>
</svg>