<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <!-- Top Face (Presentation/Frontend): Cyan to Emerald -->
    <linearGradient id="top-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <!-- Left Face (Logic/Backend): Indigo to Blue -->
    <linearGradient id="left-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <!-- Right Face (Data/Database): Violet to Rose -->
    <linearGradient id="right-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="hex-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark Architectural Container -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg-grad-2)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <g filter="url(#hex-glow)">
    <!-- Top Diamond (Frontend / Modern Web Layer) -->
    <polygon points="64,22 98,40 64,58 30,40" fill="url(#top-grad)" opacity="0.95"/>

    <!-- Left Block (Logic / 'S' Curve Profile) -->
    <path d="M 30,44 L 61,61 L 61,102 L 30,85 Z" fill="url(#left-grad)"/>
    <!-- Inset Stylized 'S' Cutout highlight on Left Face -->
    <path d="M 36,54 L 55,65 M 55,65 L 36,78 M 36,78 L 55,89" 
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- Right Block (Data / 'B' Profile) -->
    <path d="M 67,61 L 98,44 L 98,85 L 67,102 Z" fill="url(#right-grad)"/>
    <!-- Inset Stylized 'B' Cutout highlight on Right Face -->
    <path d="M 73,66 L 73,95 M 73,66 L 88,72 L 73,81 M 73,81 L 89,87 L 73,95" 
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- Accent Pivot Dot -->
  <circle cx="64" cy="61" r="3" fill="#ffffff"/>
</svg>